[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-migration-factory"
version = "0.1.0"
description = "Assess, plan, and orchestrate cloud migrations from a single CLI and library"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhishek Sawant" }]
keywords = [
    "cloud-migration",
    "aws",
    "assessment",
    "wave-planning",
    "orchestration",
    "6rs",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "black>=24.0", "pre-commit>=3.7"]

[project.scripts]
migration-factory = "migration_factory.cli:main"

[project.urls]
Homepage = "https://github.com/abhisheksawant52/cloud-migration-factory"
Issues = "https://github.com/abhisheksawant52/cloud-migration-factory/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
